ch probes blocked</text><text class="small" x="1170" y="670">bridge: forward + reverse traversal</text><text class="small" x="1170" y="695">4 camera yaws: no path occlusion</text><text class="small" x="1170" y="720">moving poses: ≥0.35u clearance</text><text class="small" x="1170" y="745">coplanar surfaces: ≥0.025u offset</text><text class="small" x="70" y="900">FLOW: F0 → 1A → 1B → 1C → 1D → 1E → 2A → 2B → 2C → 2D → 2E → 2F → 3A → 3B → 3C → HD · 3A return occurs after 3C · HD unlocked from either ending</text></svg>