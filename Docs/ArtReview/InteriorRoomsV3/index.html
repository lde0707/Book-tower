<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>종이 백룸 전 방 콘셉트</title><style>body{margin:0;background:#171410;color:#eee8dc;font-family:system-ui;padding:32px}h1{font-size:36px}p{color:#bdb4a5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(480px,1fr));gap:24px}.card{background:#242019;border:1px solid #514738;border-radius:14px;overflow:hidden}.card img{width:100%;display:block}.card h2{margin:14px 18px 6px}.card p{margin:0 18px 18px}</style></head><body><h1>종이 백룸 — 실제 게임 시점 방 콘셉트</h1><p>근접 3인칭 · 완전한 실내 · 방별 책 장르와 크레파스 색 변주</p><div class="grid" id="g"></div><script>const rooms=[['F0','제본 현관','F0-binding-vestibule.png'],['1A','접힌 회랑','1A-folded-corridor.png'],['1B','찢어진 열람실','1B-torn-reading-room.png'],['1C','양면 서고','1C-two-sided-archive.png'],['1D','잉크 발자국 보관실','1D-ink-footprint-repository.png'],['1E','표지 문양 홀','1E-cover-sigil-rotunda.png'],['2A','기억 복도','2A-memory-corridor.png'],['2B','잔상 제본실','2B-afterimage-bindery.png'],['2C','포개진 기록실','2C-overlaid-record-chamber.png'],['2D','잘못된 기록 보관소','2D-false-record-vault.png'],['2E','마모 연대실','2E-abrasion-chronology-hall.png'],['2F','어린 책갈피 통로','2F-young-bookmark-passage.png'],['3A','복원 대서고','3A-restoration-grand-archive.png'],['3B','삼중 채광실','3B-triple-daylight-chamber.png'],['3C','마지막 장','3C-the-last-page.png'],['HD','책 속의 책','HD-book-within-book.png']];g.innerHTML=rooms.map(r=>`<article class="card"><img src="${r[2]}"><h2>${r[0]} · ${r[1]}</h2><p>상세 요소·해법·스토리는 README.md 참조</p></article>`).join('')</script></body></html>
